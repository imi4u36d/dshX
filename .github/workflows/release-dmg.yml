name: Build dmg

# 触发点：
#   - 打 tag（v0.2.0）→ 构建 + 建 Release 并把 DMG 挂上去（唯一自动触发路径）
#   - 在网页上手动 Run workflow → 只出 artifact
# 注意：push 到 main、开/更新 PR 都不会再触发本工作流。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（只影响文件名与 Info.plist；留空则用 0.1.0-<短 SHA>）'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: dmg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dmg:
    # macos-15 = 当前 GA 的 arm64 镜像。macos-14 已标记 deprecated；
    # macos-15-intel / macos-26-intel 才是 Intel，别拿来跑 arm64 产物。
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write # 只有打 tag 那条路径要建 Release，其余步骤用不到
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 算短 SHA 与 Release notes 需要完整历史

      # 只是为了让 npm ci 有 npm 用；真正打进 .app 的 Node 由 make-app.sh
      # 自己下载并校验 SHA-256，两者互不影响。
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: 打印工具链版本
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
          node --version
          npm --version

      - name: 计算版本号
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            v="${GITHUB_REF_NAME}"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            v="${INPUT_VERSION}"
          else
            v="0.1.0-$(git rev-parse --short HEAD)"
          fi
          v="${v#v}" # v0.2.0 → 0.2.0：Info.plist 里不放前缀
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          echo "本次版本号：${v}"

      - name: 安装 dsh 运行时
        working-directory: runtime
        run: npm ci --no-audit --no-fund

      # 把签名证书放进一个一次性的临时钥匙串。runner 跑完就销毁，钥匙串不会留下。
      # Secret 没配（比如 fork 或新克隆的仓库）就直接跳过，make-app.sh 会自己回退
      # ad-hoc 并打印警告——那里是有意为之的兜底，不是故障。
      # 注意：secret 不能直接写进 `if:`，所以这里用 env + shell 判断。
      - name: 导入签名证书
        env:
          SIGNING_P12: ${{ secrets.DSHX_SIGNING_P12 }}
          SIGNING_P12_PASSWORD: ${{ secrets.DSHX_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${SIGNING_P12}" ]]; then
            echo "未配置 DSHX_SIGNING_P12，跳过导入；make-app.sh 将回退 ad-hoc。"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/dshx-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$SIGNING_P12" | base64 -D > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" \
            -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          rm -f "$RUNNER_TEMP/signing.p12"
          # 必须进搜索列表：make-app.sh 用 `security find-identity -v -p codesigning`
          # 判断身份在不在，而那个命令只看搜索列表里的钥匙串。
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: 组装 dshX.app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash shell/make-app.sh

      - name: 打包 DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash shell/make-dmg.sh

      - name: 写 job 摘要
        run: |
          set -euo pipefail
          {
            echo "### dshX ${{ steps.version.outputs.version }} (arm64)"
            echo
            echo '```'
            du -h build/*.dmg
            cat build/*.dmg.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 artifact
        uses: actions/upload-artifact@v7
        with:
          name: dshX-${{ steps.version.outputs.version }}-arm64
          path: |
            build/*.dmg
            build/*.dmg.sha256
          if-no-files-found: error
          retention-days: 14

      - name: 发布 Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          shopt -s nullglob
          assets=(build/*.dmg build/*.dmg.sha256)
          if gh release view "$tag" >/dev/null 2>&1; then
            # tag 被重推过：覆盖同名资产，不动已有的 release 正文。
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --verify-tag \
              --title "dshX ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi
